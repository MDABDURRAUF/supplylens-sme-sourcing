[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplylens-sme-sourcing"
version = "0.1.0"
description = "Landed-cost sourcing plans, cash limits and tariff stress tests for small and medium-sized businesses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Abdur Rauf" }]
keywords = ["sourcing", "small business", "landed cost", "tariffs", "optimization", "supply chain"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=7"]

[project.scripts]
sme-sourcing = "sme_sourcing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
